<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD Reseller Telecom</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}
header{background:#101827;color:white;padding:22px 16px}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0;color:#b9c6da}
.hero{padding:25px 16px;background:linear-gradient(135deg,#10243c,#1769aa);color:white}
.hero h2{font-size:27px;margin:0 0 10px}
.hero p{line-height:1.5}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-top:10px}
.tabs{display:flex;gap:8px;padding:15px;overflow:auto}
.tabs button{border:0;border-radius:20px;padding:11px 16px;background:white;font-weight:bold;white-space:nowrap}
.tabs button.active{background:#1769aa;color:white}
h2.section{padding:0 15px;font-size:21px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0000000d}
.card img{width:100%;height:145px;object-fit:contain;background:#fff;padding:8px}
.info{padding:12px}
.info h3{font-size:15px;margin:0 0 8px}
.price{font-weight:bold;color:#087c54;font-size:17px}
.badge{font-size:11px;background:#e5f2ff;color:#1769aa;padding:5px 7px;border-radius:5px;display:inline-block;margin-bottom:8px}
.info p{font-size:12px;color:#687386}
.order{display:block;text-align:center;text-decoration:none;background:#087c54;color:white;padding:10px;border-radius:7px;font-weight:bold;font-size:13px}
footer{text-align:center;background:#101827;color:white;padding:25px 15px;margin-top:20px}
footer a{color:#61d9a7}
</style>
</head>
<body>
<header>
<h1>📱 BD Reseller Telecom</h1>
<p>Your Trusted Mobile Shop</p>
</header>
<section class="hero">
<h2>Find Your Next Phone</h2>
<p>New & Used Smartphones at Great Prices.</p>
<input class="search" id="search" placeholder="🔍 Search mobile..." oninput="render()">
</section>
<div class="tabs">
<button class="active" onclick="setType('All',this)">All Phones</button>
<button onclick="setType('New',this)">New Phones</button>
<button onclick="setType('Used',this)">Used Phones</button>
</div>
<h2 class="section">📱 Available Mobiles</h2>
<div class="products" id="products"></div>
<footer>
<h2>BD Reseller Telecom</h2>
<p>Interested in a phone? Contact us today!</p>
<a id="contact" href="https://wa.me/" target="_blank">Contact on WhatsApp</a>
<p>© 2026 BD Reseller Telecom</p>
</footer>
<script>
let type='All';
const phones=[
{name:'Samsung Galaxy S24 Ultra',price:'৳ 75,000',condition:'Used',details:'12GB RAM • 256GB Storage',img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80'},
{name:'iPhone 15 Pro Max',price:'৳ 95,000',condition:'Used',details:'256GB Storage • Excellent Condition',img:'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=600&q=80'},
{name:'Samsung Galaxy A55',price:'৳ 42,000',condition:'New',details:'8GB RAM • 256GB Storage',img:'https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=600&q=80'},
{name:'Redmi Note Series',price:'৳ 25,000',condition:'New',details:'8GB RAM • 256GB Storage',img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80'}
];
function setType(t,b){type=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function render(){
let q=document.getElementById('search').value.toLowerCase();
document.getElementById('products').innerHTML=phones.filter(p=>(type==='All'||p.condition===type)&&p.name.toLowerCase().includes(q)).map(p=>`<div class="card"><img src="${p.img}" alt="Mobile phone"><div class="info"><span class="badge">${p.condition} Phone</span><h3>${p.name}</h3><div class="price">${p.price}</div><p>${p.details}</p><a class="order" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Hello, I am interested in '+p.name+' priced '+p.price+'. Is it available?')}">Order on WhatsApp</a></div></div>`).join('');
}
render();
</script>
</body>
</html>
